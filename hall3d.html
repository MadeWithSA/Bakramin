// Matching staircases on BOTH sides, with straight continuous handrails following the stair slope
function connectRail(a,b,radius,material){
  const start=new THREE.Vector3(...a), end=new THREE.Vector3(...b);
  const delta=new THREE.Vector3().subVectors(end,start);
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,delta.length(),12),material);
  mesh.position.copy(start).add(end).multiplyScalar(.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),delta.normalize());
  mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);
}

  seatInfo.innerHTML=(sel.length?'<span><b>'+sel.map(lbl).join('; ')+'</b> — '+tx('tot')+' '+(sel.length*PRICE).toLocaleString('ru-RU')+' UZS</span>':'<span>'+tx('none')+'</span>')+'<button class="go" id="tocart" '+(sel.length?'':'disabled')+'>'+tx('cart')+'</button>';
  document.getElementById('tocart').onclick=()=>{if(!sel.length)return;save();localStorage.cur=JSON.stringify({mid:MID,time:TIME,seats:sel});localStorage.promo='0';location.href='cart.html'};
}
const raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2();
let pickables=null;
function pickSeat(e){
  if(!pickables)pickables=scene.children.filter(o=>o.isMesh&&!o.userData.ov);
  const r=dom.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  raycaster.setFromCamera(mouse,camera);
  const hit=raycaster.intersectObjects(pickables,false)[0];
  if(!hit||hit.object.userData.seatId===undefined||hit.distance>16)return;
  const id=sid(seats[hit.object.userData.seatId]);
  if(isBk(id)){seatInfo.firstChild.textContent=tx('taken');return}
  sel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id];save();paint();refresh();
}
paint();refresh();
function spawn(){
  // start on the landing next to the right-hand door, looking down the stairs
  yaw=0;pitch=-.18;
  camera.position.set(9,walkFloor(9,6.2)+EYE,6.2);
  camera.rotation.set(pitch,yaw,0);
  vel.set(0,0,0);
}
// Two stable lighting presets: no cumulative intensity changes when switching.
const lightPresets=[];
scene.traverse(o=>{
  if(o.isLight) lightPresets.push({light:o,base:o.intensity});
});
function setRoomLighting(isOn){
  dim=!isOn;
  for(const item of lightPresets){
    const l=item.light, base=item.base;
    if(l.isAmbientLight) l.intensity=isOn?.95:.10;
    else if(l.isHemisphereLight) l.intensity=isOn?1.15:.16;
    else if(l.isDirectionalLight) l.intensity=isOn?2.7:.16;
    else if(l===screenGlow) l.intensity=isOn?2.2:.75;
    else l.intensity=isOn?base:Math.max(.025,base*.10);
  }
  aisleStrips.forEach(m=>m.color.setHex(isOn?0xffcf88:0x684b2b));
  active(isOn?'lightsOn':'lightsOff');
}
btn('lightsOn',()=>setRoomLighting(true));
btn('lightsOff',()=>setRoomLighting(false));
setRoomLighting(true);
const keys={};const vel=new THREE.Vector3();addEventListener('keydown',e=>{keys[e.code]=true;if(walking && ['KeyW','KeyA','KeyS','KeyD','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
// Real surface height under the player: stairs, landing, seating tiers, floor
function walkFloor(x,z){
  const ax=Math.abs(x);
  if(ax>8.29 && ax<9.71 && z>=-6.31 && z<=7.2){
    if(z>5.93)return 2.385;                                  // landing at the door
    const i=THREE.MathUtils.clamp(Math.floor((z+6.31)/1.02),0,11);
    return .18+i*.19+.115;                                   // top of step i
  }
  if(ax<8.3 && z>-5.225 && z<7.2){
    if(z>4.05)return rowY[0]+.06;
    if(z>.95)return rowY[1]+.06;
    if(z>-2.15)return rowY[2]+.06;
    return rowY[3]+.06;
  }
  return 0;
}
// Collision: walls, rails along both staircases, and every armchair
const chairBoxes=[];
for(let r=0;r<4;r++){const count=r===0?6:7,sp=2.05,st=-(count-1)*sp/2;for(let j=0;j<count;j++){const cx=st+j*sp,cz=rowZ[r]-.02;chairBoxes.push([cx-.93,cx+.93,cz-1.03,cz+.96])}}
function blocked(x,z){
  const ax=Math.abs(x);
  if(ax>10.45||z<-12.0||z>6.7)return true;                   // walls and screen
  if(z>-6.31){
    if(ax>7.79&&ax<8.29)return true;                         // inner stair rail
    if(ax>9.71)return true;                                  // outer stair rail / wall
  }
  for(const c of chairBoxes){if(x>c[0]-R&&x<c[1]+R&&z>c[2]-R&&z<c[3]+R)return true}
  return false;
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();let walkPhase=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04);
  if(walking){
    const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    const wish=new THREE.Vector3();
    if(keys.KeyW||keys.ArrowUp)wish.add(forward);
    if(keys.KeyS||keys.ArrowDown)wish.sub(forward);
    if(keys.KeyD)wish.add(right);
    if(keys.KeyA)wish.sub(right);
    if(keys.ArrowRight)yaw-=dt*1.8;
    if(keys.ArrowLeft)yaw+=dt*1.8;
    const speed=(keys.ShiftLeft||keys.ShiftRight)?5.2:3.0;
    if(wish.lengthSq()>0)wish.normalize().multiplyScalar(speed);
    // smooth acceleration / stopping
    vel.lerp(wish,1-Math.exp(-dt*12));
    // move per axis so you slide along rails and chairs instead of sticking
    const nx=camera.position.x+vel.x*dt, nz=camera.position.z+vel.z*dt;
    if(!blocked(nx,camera.position.z))camera.position.x=nx;
    if(!blocked(camera.position.x,nz))camera.position.z=nz;
    // eye height follows the real surface smoothly (steps feel like steps) + light walking bob
    const moving=vel.length();
    walkPhase+=moving*dt*2.6;
    const bob=Math.sin(walkPhase*3.2)*.028*Math.min(moving/3,1.4);
    const targetY=walkFloor(camera.position.x,camera.position.z)+EYE+bob;
    camera.position.y+=(targetY-camera.position.y)*(1-Math.exp(-dt*16));
    camera.rotation.set(pitch,yaw,0);
  }
  renderer.render(scene,camera);
}
// ---- extra hall details: curtains, speakers, exit signs, ceiling beams, LED edges, seat tags
const glowG=new THREE.MeshStandardMaterial({color:0x8a6a2a,emissive:0xd4a24a,emissiveIntensity:1.5}),curt=mat(0x4a0e17,.95),glass=new THREE.MeshStandardMaterial({color:0x101c28,roughness:.7,metalness:0,emissive:0x16324a,emissiveIntensity:.45});
const tex=(text,w,h,fg,bg,font)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(bg){x.fillStyle=bg;x.fillRect(0,0,w,h)}x.fillStyle=fg;x.font=font;x.textAlign='center';x.textBaseline='middle';x.fillText(text,w/2,h/2);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t};
for(const sd of [-1,1]){
  for(let i=0;i<11;i++)box(.3,5.7,.3+(i%2)*.14,curt,sd*(6.75+i*.29),3.2,-12.35+(i%2)*.04,{shadow:false});   // velvet curtain folds
  box(3.6,.1,.12,gold,sd*8.25,6.1,-12.2,{shadow:false});
  box(.55,1.7,.6,black,sd*10.45,3.3,-10.8);box(.5,1.6,.05,mat(0x1d1f22,.9),sd*10.18,3.3,-10.8);                // speaker
  for(const yy of [3.62,2.95]){const cn=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.05,28),gold);cn.rotation.z=Math.PI/2;cn.position.set(sd*10.15,yy,-10.8);scene.add(cn)}
  box(1.1,.34,.1,mat(0x0b7a36,.5),sd*9,6.1,7.1,{shadow:false});                                                // exit sign
  const ex=new THREE.Mesh(new THREE.PlaneGeometry(1.0,.28),new THREE.MeshBasicMaterial({map:tex('ВЫХОД · EXIT',256,72,'#eaffea','#0b7a36','700 30px sans-serif')}));ex.rotation.y=Math.PI;ex.position.set(sd*9,6.1,7.04);scene.add(ex);
}
for(const zz of [-9,-5,-1,3,6.5]){box(20.4,.22,.35,black,0,7.8,zz,{shadow:false});box(20.2,.04,.06,glowG,0,7.66,zz,{shadow:false})}
for(let r=0;r<4;r++)box(16.6,.03,.05,glowG,0,rowY[r]+.075,rowZ[r]-1.5,{shadow:false});                       // tier LED edge
box(2.5,.8,.04,gold,0,7.28,7.15,{shadow:false});box(2.3,.6,.03,glass,0,7.28,7.125,{shadow:false});            // projector window, flush with the wall
seats.forEach(st=>{const b=isBk(sid(st));const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex(st.row+' · '+st.num,128,64,b?'#ff6a6a':'#f0d27a','rgba(8,8,8,.72)','700 32px sans-serif'),transparent:true,depthWrite:false}));sp.position.set(st.cx,st.y+2.15,st.z+.2);sp.scale.set(.66,.33,1);scene.add(sp)});
spawn();
animate();
setTimeout(()=>{const l=document.getElementById('loading');l.style.opacity=0;setTimeout(()=>l.remove(),700)},900);
